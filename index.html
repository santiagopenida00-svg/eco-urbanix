<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Sitio Informativo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .btn-link {
      display: block;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-link:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Título o Nombre</h1>
    <p>Información breve sobre la página o servicios.</p>

    <!-- Accesos Rápidos -->
    <a href="https://wa.me/tunumero" class="btn-link" target="_blank">Contactar por WhatsApp</a>
    <a href="https://drive.google.com" class="btn-link" target="_blank">Ver Documentos / Archivos</a>
    <a href="https://instagram.com" class="btn-link" target="_blank">Instagram</a>
    <a href="mailto:correo@ejemplo.com" class="btn-link">Enviar Correo</a>
  </div>

</body>
</html>
